[package]
name = "clair3-connect-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Clair3-connect inference server binary — Rust tch-rs `(X) -> Y` (Phase 5 MVP)."

[lib]
name = "clair3_connect_server"
path = "src/lib.rs"

[[bin]]
name = "clair3-connect-server"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tonic = { version = "0.12", features = ["tls"] }
async-trait = "0.1"

arc-swap = "1"

dialoguer = { version = "0.11", default-features = false }
console = "0.16"

serde_yaml.workspace = true

rcgen = "0.13"

clair3-connect-infer = { path = "../clair3-connect-infer" }
clair3-connect-transport = { path = "../clair3-connect-transport" }
tch = "0.18"

[dev-dependencies]
tempfile = "3"
tokio-stream = { version = "0.1", features = ["net"] }
tch = "0.18"
