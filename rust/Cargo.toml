[workspace]
resolver = "2"
members = [
    "crates/clair3-connect-core",
    "crates/clair3-connect-longphase",
    "crates/clair3-connect-transport",
    "crates/clair3-connect-infer",
    "crates/clair3-connect-client",
    "crates/clair3-connect-server",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "BSD-3-Clause"
authors = ["Clair3-connect contributors"]
repository = "https://github.com/HKU-BAL/Clair3"
description = "Rust client/server re-architecture of Clair3."

[workspace.dependencies]

anyhow = "1"
thiserror = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

sha2 = "0.10"
hex = "0.4"

bytes = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

ndarray = "0.16"
ndarray-npy = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.release.package.clair3-connect-server]
opt-level = 1

[profile.release.package.clair3-connect-client]
opt-level = 1

[profile.dev]
opt-level = 0
debug = true

[patch.crates-io]
hts-sys = { path = "vendor/hts-sys" }
