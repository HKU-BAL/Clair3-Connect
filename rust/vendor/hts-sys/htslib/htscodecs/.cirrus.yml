env_template: &ENVIRONMENT
  environment:
    LC_ALL: C
    CIRRUS_CLONE_DEPTH: 1
  timeout_in: 10m

compile_template: &COMPILE
  compile_script:
    - autoreconf -i
    - ./configure
    - make -j4

  test_script:
    - make check

task:
  << : *ENVIRONMENT
  name: linux-gcc
  container:
    memory: 1G
    image: gcc:latest

  compile_script:
    - autoreconf -i
    - ./configure CC="gcc -fsanitize=address,undefined"
    - make -j4 CFLAGS="-g -O3 -Wall -Werror"

  test_script:
    - make check CFLAGS="-g -O3 -Wall -Werror"
    - make distcheck

task:
  << : *ENVIRONMENT
  name: linux-arm
  arm_container:
    image: ubuntu:latest
    cpu: 2
    memory: 1G

  install_script: |
    apt-get update
    apt-get install -y --no-install-suggests --no-install-recommends     \
        ca-certificates clang libc-dev make git autoconf automake libtool \
        libbz2-dev

  compile_script:
    - autoreconf -i
    - ./configure CC="clang" --disable-shared
    - make -j4 CFLAGS="-g -O3 -Wall -Werror"

  test_script:
    - make check CFLAGS="-g -O3 -Wall -Werror"
    - make distcheck

rocky_task:
  << : *ENVIRONMENT
  name: rockylinux-gcc
  container:
    image: rockylinux:9
    cpu: 2
    memory: 1G

  install_script: |
    yum install -y autoconf automake libtool make gcc zlib-devel \
        bzip2 bzip2-devel git diffutils

  << : *COMPILE

task:
  << : *ENVIRONMENT
  name: macosx
  macos_instance:
    image: ghcr.io/cirruslabs/macos-ventura-base:latest

  package_install_script:
    - brew install autoconf automake libtool

  compile_script:
    - autoreconf -i
    - ./configure CFLAGS="-g -O3 -Wall -Werror -arch arm64 -arch x86_64"
    - make -j4

  test_script:
    - make check

task:
  name: freebsd
  freebsd_instance:
    image_family: freebsd-13-2

  pkginstall_script:
    - pkg update -f
    - pkg install -y gcc autoconf automake libdeflate libtool

  compile_script:
    - autoreconf -i
    - ./configure
    - make -j4 CFLAGS="-g -O3 -Wall -Werror"

  test_script:
    - make check CFLAGS="-g -O3 -Wall -Werror"
